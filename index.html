<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14244a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Bloom</title>
<style>
  :root { --ink: #1d2a4a; --panel: rgba(255,255,255,.9); --accent: #3d8bff; --cyan: #5ff2ff; --good: #2f9e57; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #24407a, #14244a 60%, #0b1430); touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .gone { opacity: 0 !important; pointer-events: none !important; }
  .ic { display: inline-block; vertical-align: middle; flex: none; }

  /* top bar */
  #top { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  #left { display: grid; gap: 6px; }
  #restore { --p: 0; position: relative; width: 150px; height: 26px; border-radius: 13px; background: rgba(13,24,52,.55); overflow: hidden; display: flex; align-items: center; gap: 6px; padding-left: 4px; color: #fff; font-weight: 800; font-size: 13px; }
  #restore::before { content: ""; position: absolute; inset: 0; width: calc(var(--p) * 100%); background: linear-gradient(90deg, #4fd06a, #8de86a); transition: width .5s; }
  #restore > * { position: relative; }
  #restore .dot { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c8fbff, var(--cyan) 55%, #1aa7c4); box-shadow: 0 0 8px var(--cyan); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 13px; background: rgba(13,24,52,.55); color: #fff; font-weight: 800; font-size: 13px; width: max-content; }
  .pill .sos { font-size: 10px; background: #ef4b5f; border-radius: 6px; padding: 1px 4px; letter-spacing: .5px; }
  #right { display: grid; gap: 6px; justify-items: end; }
  .btn { pointer-events: auto; width: 38px; height: 38px; border-radius: 12px; border: 0; background: rgba(255,255,255,.75); display: grid; place-items: center; color: var(--ink); padding: 0; }
  .btn svg { width: 20px; height: 20px; }
  #mute .x { display: none; } #mute.off .x { display: inline; } #mute.off .w { display: none; }
  .bagcap { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 13px; background: rgba(13,24,52,.55); color: #fff; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .bagcap.full { background: #ef4b5f; }
  #bagrows { display: grid; gap: 4px; justify-items: end; }
  .mrow { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 5px; border-radius: 12px; background: rgba(255,255,255,.88); font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; }

  /* signs, help bubbles, air */
  #sites { position: fixed; inset: 0; pointer-events: none; }
  .site { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 3px; padding: 6px 10px 7px; border-radius: 12px; background: var(--panel); box-shadow: 0 4px 12px rgba(10,20,50,.25); font-size: 12px; white-space: nowrap; transition: opacity .2s; }
  .site b { font-size: 12px; font-weight: 900; }
  .site.near { box-shadow: 0 0 0 3px var(--cyan), 0 4px 12px rgba(10,20,50,.25); }
  .site .row { display: flex; gap: 8px; }
  .cost { display: inline-flex; align-items: center; gap: 2px; font-weight: 900; font-size: 15px; opacity: .55; font-variant-numeric: tabular-nums; }
  .cost.have { opacity: 1; }
  .max { font-weight: 900; font-size: 13px; color: #fff; background: var(--good); padding: 2px 10px; border-radius: 8px; letter-spacing: 1px; }
  .lock { font-size: 11px; font-weight: 700; max-width: 170px; white-space: normal; text-align: center; opacity: .8; }
  .store { font-weight: 900; font-size: 13px; display: inline-flex; gap: 3px; align-items: center; }
  .help { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 15px; color: #ef4b5f; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; letter-spacing: 1px; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { margin-top: -6px; } }
  #air { --p: 1; position: fixed; left: 0; top: 0; width: 56px; height: 8px; border-radius: 4px; background: rgba(13,24,52,.5); overflow: hidden; pointer-events: none; transition: opacity .3s; }
  #air::before { content: ""; position: absolute; inset: 0; width: calc(var(--p) * 100%); background: var(--cyan); }
  #air.low::before { background: #ff8a5b; }

  /* workbench */
  #bench { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%); width: min(380px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 18px; background: var(--panel); box-shadow: 0 8px 24px rgba(10,20,50,.35); transition: opacity .25s; }
  #bench h3 { margin: 0 0 6px; font-size: 16px; }
  .up { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(29,42,74,.1); }
  .upn { display: grid; } .upn span { font-size: 11px; opacity: .7; }
  .up .row { display: flex; gap: 6px; }
  .up button { border: 0; border-radius: 10px; padding: 7px 10px; background: var(--accent); color: #fff; font: 800 12px/1 inherit; font-family: inherit; }
  .up button:disabled { background: #b8c2d6; }
  .skills { font-size: 11px; opacity: .7; padding-top: 6px; border-top: 1px solid rgba(29,42,74,.1); }

  #launch { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18%); transform: translateX(-50%); z-index: 5; transition: opacity .25s; }
  #restore.gold::before { background: linear-gradient(90deg, #ffd65a, #ffb347); }
  .badge { width: 64px; height: 64px; margin: 4px auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; color: #fff; background: radial-gradient(circle at 35% 30%, #fff3c0, #ffd65a 50%, #d9a520); box-shadow: 0 0 24px rgba(255,214,90,.6); }
  .lbl { font-size: 11px; font-weight: 800; opacity: .6; align-self: center; }
  .recipe { display: inline-flex; align-items: center; gap: 3px; font-weight: 900; font-size: 13px; }
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 92px); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 9px 16px; border-radius: 14px; background: rgba(13,24,52,.85); color: #fff; font-weight: 800; font-size: 14px; text-align: center; pointer-events: none; transition: opacity .35s; }
  #toast.good { background: var(--good); }
  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12%); transform: translateX(-50%); color: #fff; background: rgba(13,24,52,.6); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; pointer-events: none; transition: opacity .8s; white-space: nowrap; }
  #stick { position: fixed; width: 0; height: 0; pointer-events: none; transition: opacity .2s; }
  #stick::before { content: ""; position: absolute; left: -44px; top: -44px; width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(255,255,255,.1); }
  #stick i { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.85); }

  .screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(11,20,48,.55); backdrop-filter: blur(4px); transition: opacity .5s; text-align: center; color: #fff; padding-inline: 16px; }
  .screen h1 { font-size: 64px; margin: 0; letter-spacing: 2px; font-weight: 900; color: #fff; text-shadow: 0 0 24px var(--cyan); }
  .screen p { margin: 6px auto 26px; font-size: 16px; font-weight: 600; opacity: .85; max-width: 320px; }
  .big { display: inline-block; padding: 14px 40px; border-radius: 99px; background: linear-gradient(#5ff2ff, #2fb8e0); color: #0b1d3a; font-weight: 900; font-size: 18px; border: 0; box-shadow: 0 0 22px rgba(95,242,255,.5); font-family: inherit; }
  .link { display: block; margin: 16px auto 0; background: none; border: 0; color: #fff; opacity: .7; text-decoration: underline; font: 700 13px inherit; font-family: inherit; }
  .orb { width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%; background: radial-gradient(circle at 50% 70%, #7fd657 0 38%, transparent 39%), radial-gradient(circle at 35% 30%, #d8feff, #5ff2ff 45%, #1aa7c4 75%); box-shadow: 0 0 30px rgba(95,242,255,.6); }
  button:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .help { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="sites"></div>
<div id="air" class="gone"></div>
<div id="top">
  <div id="left">
    <div id="restore"><span class="dot"></span><b>0%</b></div>
    <div class="pill"><span class="sos">SOS</span><span id="sos">0/4</span></div>
  </div>
  <div id="right">
    <button class="btn" id="mute" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="m16 9 6 6m0-6-6 6"/></svg></button>
    <div class="bagcap"><svg width="16" height="16" viewBox="0 0 20 20"><path d="M5 7 Q5 4 10 4 Q15 4 15 7 L16 17 L4 17 Z" fill="#f5c542"/><rect x="7" y="9" width="6" height="4" rx="1" fill="#c99a1c"/></svg><span id="cap">0/30</span></div>
    <div id="bagrows"></div>
  </div>
</div>
<div id="bench" class="gone"></div>
<button id="launch" class="big gone">Launch</button>
<div id="toast" class="gone"></div>
<div id="hint" class="gone">Press and pull to walk</div>
<div id="stick" class="gone"><i></i></div>
<div class="screen" id="start"><div>
  <div class="orb"></div>
  <h1>Bloom</h1>
  <p>Stranded on a dead little planet. Grow your bubble, bring the world back to life, and fix your rocket.</p>
  <button class="big" id="go">Start</button>
  <button class="link gone" id="fresh">Start over</button>
</div></div>
<div class="screen gone" id="win"><div>
  <div class="orb"></div>
  <h1 style="font-size:40px" id="win-title">Lift off!</h1>
  <div id="win-badge" class="badge gone">★</div>
  <p id="win-text"></p>
  <p id="win-stats" style="font-weight:800"></p>
  <button class="big" id="again">Keep exploring</button>
</div></div>
